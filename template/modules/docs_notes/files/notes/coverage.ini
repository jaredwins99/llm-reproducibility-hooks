; What the notes check requires, declared rather than hardcoded, so adding a
; language or a directory cannot leave it silently unchecked.
;
;   directories  where code that a run or a build uses lives
;   suffixes     the file kinds that need covering
;   exclude      globs skipped inside those directories (tests are read beside
;                the code they test, so they need no note of their own)
;   registries   optional "module:attribute" pairs, each importable and giving
;                an iterable of paths that also counts as coverage; use one
;                when the project already documents its modules somewhere,
;                such as a catalog, so a note need not repeat it

[coverage]
directories = src, scripts
suffixes = .py, .R, .sh
exclude = */tests/*, tests/*, */__init__.py
registries =
