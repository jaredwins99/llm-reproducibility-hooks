  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.3
    hooks:
      - id: style-files
      - id: lintr
  - repo: local
    hooks:
      - id: r-same-call-shadowing
        name: R same-call shadowing (correctness/checks/check_r_shadowing.R)
        entry: Rscript --no-save --no-restore correctness/checks/check_r_shadowing.R
        language: system
        files: '\.[Rr]$'
